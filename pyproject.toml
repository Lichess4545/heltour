[tool.poetry]
name = "heltour"
version = "2.7.0"
description = "A [hel]per for [tour]naments.  Intended to run swiss based tournaments, but is actually the source for the lichess4545.com leagues."
authors = ["Lakin Wecker <lakin@structuredabstraction.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
django = "==4.2.*"
django-reversion = "==6.4.0"
psycopg2-binary = "==2.9.13"
django-debug-toolbar = "==6.3.0"
responses = "==0.26.3"
django-bootstrap3 = "==26.1"
gspread = "==0.4.1"
oauth2client = "==2.2.0"
django-ckeditor = "==6.7.4"
django-cacheops = "==7.2.*"
django-contrib-comments = "==2.2.0"
django-redis = "==6.0.0"
django-sass-processor = "^1.4"
libsass = "^0.23.0"
django-compressor = "^4.6"
django-impersonate = "==1.9.5"
django-ipware = "==7.0.1"
redis = "==8.2.*"
websocket-client = "==1.9.2"
celery = "==5.7.*"
icalendar = "==7.3.2"
pillow = "==13.0.0"
requests = {extras = ["security"], version = "^2.34.2"}
django-stubs = "5.1.3"
django-stubs-ext = "5.1.3"
more-itertools = "^11.2.0"
django-environ = "^0.12.0"
gunicorn = "^27.0.0"
django-celery-beat = "^2.9.0"
django-celery-results = "^2.6.0"
djangorestframework = "==3.17.*"
email-validator = "==2.4.*"
email-normalize = "==3.2.*"

[tool.poetry.group.dev.dependencies]
djangorestframework-stubs = "==3.14.4"
ty = "^0.0.112"
ruff = "==0.17.6"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ty]
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["heltour/tournament"]
include = ["heltour/api_v2"]

[tool.django-stubs]
django_settings_module = "heltour.test_settings"

[tool.ruff]
target-version = "py312"
include = ["heltour/api_v2/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
